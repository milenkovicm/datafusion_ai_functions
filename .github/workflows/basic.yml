name: Basic Flow

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # this one speeds up builds, they say
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # make cargo format to fail first
      # before bringing other things, and spending time
      # compiling
      - name: Cargo Format Check
        run: cargo fmt --all --check --
        # we use cache if format is correct
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo Test
        # should be faster than compiling tests again in
        # test phase
        # run: cargo test --no-run --locked --all-features
        # run: cargo test --all-features -- --nocapture --quiet
        run: cargo test -- --nocapture --quiet
      # - name: Cargo Run Tests
      #   run: cargo test  -- --nocapture --quiet
